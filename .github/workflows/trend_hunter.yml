name: Agent Trend Hunter Automation

on:
  schedule:
    # Chạy tự động vào 07:00 sáng hàng ngày (giờ Việt Nam, tương đương 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" để chạy thủ công bất kỳ lúc nào

jobs:
  run-trend-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn (Checkout Repository)
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Chạy script Trend Hunter
        env:
          ORTHOGONAL_API_KEY: ${{ secrets.ORTHOGONAL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trend_hunter.py # Đổi tên file này nếu file Python của bạn đặt tên khác
