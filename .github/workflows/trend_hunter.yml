name: TikTok Shorts Trend Hunter Agent

on:
  schedule:
    # Chạy vào 00:00 UTC (7:00 AM VN) và 12:00 UTC (19:00 PM VN) hàng ngày
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" chạy bằng tay để test

jobs:
  run-agent:
    # Đổi từ ubuntu-latest sang ubuntu-24.04 để tắt cảnh báo di trú hệ điều hành
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện phụ thuộc
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chạy Agent săn xu hướng
      env:
        ORTHOGONAL_API_KEY: ${{ secrets.ORTHOGONAL_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python trend_agent.py
