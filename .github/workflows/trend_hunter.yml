name: TikTok Shorts Trend Hunter Agent

on:
  schedule:
    # Tự động kích hoạt 2 lần/ngày: lúc 07:00 sáng và 19:00 tối (Theo giờ Việt Nam)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Cho phép bạn chủ động bấm nút "Run workflow" trên giao diện Web để kiểm tra bất cứ lúc nào

jobs:
  run-agent:
    # Sử dụng hệ điều hành Ubuntu ổn định cố định để loại bỏ hoàn toàn các lỗi cảnh báo môi trường di trú
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Tự động tối ưu hóa tốc độ tải thư viện cho các lần chạy sau

    - name: Cài đặt các thư viện phụ thuộc
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Chạy Agent săn xu hướng TikTok và Shorts
      env:
        # Nạp trực tiếp 3 mã khóa bảo mật từ mục GitHub Repository Secrets vào chương trình
        ORTHOGONAL_API_KEY: ${{ secrets.ORTHOGONAL_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python trend_agent.py
